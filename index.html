<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Video Player Tester</title>
  <meta name="description" content="Cycle fullscreen techniques for one YouTube link. No video element. No camera.">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    document.documentElement.dataset.role =
      new URLSearchParams(location.search).get("role") === "remote" ? "remote" : "display";
  </script>
</head>
<body>
  <main class="remote" id="remote">
    <form id="remote-form">
      <p class="kicker">Companion remote</p>
      <h1>Paste a YouTube link</h1>
      <label for="remote-url">YouTube link</label>
      <input id="remote-url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://www.youtube.com/watch?v=…" required>
      <div class="row">
        <button class="btn" type="button" id="remote-paste">Paste</button>
        <button class="btn primary" type="submit" id="remote-send">Send</button>
      </div>
      <p class="msg" id="remote-msg" role="status"></p>
      <p class="fine">Session <code id="remote-room"></code></p>
    </form>
  </main>

  <div class="app" id="desk">
    <header class="bar">
      <form id="url-form" class="url">
        <label class="sr" for="url">YouTube link</label>
        <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="YouTube link">
        <button class="btn primary" type="submit">Load</button>
      </form>
      <p class="now" id="now" aria-live="polite">1 / 1</p>
      <div class="row">
        <button class="btn" type="button" id="prev" aria-label="Previous technique">Prev</button>
        <button class="btn" type="button" id="next" aria-label="Next technique">Next</button>
        <button class="btn" type="button" id="phone">Phone</button>
      </div>
    </header>

    <div class="stage" id="stage"></div>

    <footer class="dock">
      <div class="extras" id="extras"></div>
      <p class="status" id="status" role="status"></p>
    </footer>

    <div class="phone-pop" id="phone-pop" hidden>
      <p class="kicker">Pairing panel</p>
      <img id="qr" width="180" height="180" alt="QR code for the companion remote">
      <p class="fine">Session <code id="room-code"></code></p>
      <p class="fine" id="relay">Relay idle</p>
      <button class="btn" type="button" id="copy-link">Copy remote link</button>
    </div>
  </div>

  <script src="js/qrcode.js"></script>
  <script src="js/alt-players.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
